<script type="module">
import { auth, firebaseConfigured } from './firebase-config.js';
import { createUserWithEmailAndPassword, updateProfile, signInWithEmailAndPassword, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

const form = document.getElementById('authForm'), status = document.getElementById('status'), submit = document.getElementById('submitBtn');

form.addEventListener('submit', async e => {
  e.preventDefault();
  hideStatus();
  
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirmPassword').value;

  if (name.length < 2) return showStatus('Please enter your full name.', 'error');
  if (password.length < 8) return showStatus('Your password must be at least 8 characters.', 'error');
  if (password !== confirm) return showStatus('Passwords do not match. Please check both fields.', 'error');
  if (!firebaseConfigured) return showStatus('Authentication setup is not complete yet. Add your Firebase web config in firebase-config.js first.', 'error');

  submit.disabled = true;
  submit.textContent = 'Creating account…';

  try {
    // 1. Account Create Karein
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    await updateProfile(cred.user, { displayName: name });
    
    // 2. Session Save karke foran Login karayein
    await setPersistence(auth, browserLocalPersistence);
    await signInWithEmailAndPassword(auth, email, password);

    // 3. Seedha Home Page par bhej kar Welcome message dikhayein
    window.location.href = 'index.html?welcome=true';

  } catch (err) {
    showStatus(authError(err.code), 'error');
  } finally {
    submit.disabled = false;
    submit.textContent = 'Create Account';
  }
});

function showStatus(message, type) {
  const el = document.getElementById('status');
  el.textContent = message;
  el.className = 'status show ' + type;
}

function hideStatus() {
  const el = document.getElementById('status');
  el.textContent = '';
  el.className = 'status';
}

function authError(code) {
  const messages = {
    'auth/invalid-email': 'Please enter a valid email address.',
    'auth/email-already-in-use': 'An account already exists with this email. Please sign in.',
    'auth/weak-password': 'Choose a stronger password with at least 8 characters.',
    'auth/too-many-requests': 'Too many attempts. Please wait a little and try again.',
    'auth/network-request-failed': 'Network error. Check your internet connection and try again.',
    'auth/operation-not-allowed': 'Email/password sign-in is not enabled in Firebase Authentication.'
  };
  return messages[code] || 'We could not complete this request. Please check your details and try again.';
}

document.querySelectorAll('.show-pass').forEach(btn => btn.addEventListener('click', () => {
  const input = document.getElementById(btn.dataset.target);
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.textContent = show ? 'HIDE' : 'SHOW';
}));
</script>
